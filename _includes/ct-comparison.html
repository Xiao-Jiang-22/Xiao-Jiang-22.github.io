<figure class="ct-comparison" data-ct-comparison>
  <figcaption id="{{ include.id }}-title">{{ include.title }}</figcaption>
  <div class="ct-comparison__viewport" style="--reveal: 50%">
    <div class="ct-comparison__image ct-comparison__image--after">
      <img src="{{ include.after | relative_url }}" alt="{{ include.title }} reconstruction with Holoscale" loading="lazy" draggable="false">
      <span class="ct-comparison__label ct-comparison__label--after" aria-hidden="true">Holoscale</span>
    </div>
    <div class="ct-comparison__image ct-comparison__image--before">
      <img src="{{ include.before | relative_url }}" alt="{{ include.title }} reconstruction with FDK" loading="lazy" draggable="false">
      <span class="ct-comparison__label ct-comparison__label--before" aria-hidden="true">FDK</span>
    </div>
    <div class="ct-comparison__divider" aria-hidden="true">
      <span class="ct-comparison__handle">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7-5 5 5 5M17 7l5 5-5 5M12 5v14"/></svg>
      </span>
    </div>
    <div class="ct-comparison__control" role="slider" tabindex="0" aria-labelledby="{{ include.id }}-title" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-valuetext="50% FDK image revealed" hidden></div>
  </div>
</figure>
